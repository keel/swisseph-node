name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }
          # macos-13 (x64 runner) 已退役：darwin-x64 在 arm64 mac 上交叉编译
          - { os: macos-latest,     plat: darwin-arm64 }
          - { os: macos-latest,     plat: darwin-x64, cross_arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: prebuild (native)
        if: matrix.cross_arch != 'x64'
        run: npm run prebuild
      - name: prebuild (cross-compile x86_64)
        if: matrix.cross_arch == 'x64'
        env:
          ARCHFLAGS: "-arch x86_64"
        run: npm run prebuild -- --arch x64
      - run: npm run gen-b64
      - name: Upload real payload only
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.plat }}
          path: |
            prebuilds/${{ matrix.plat }}/
            lib/b64/${{ matrix.plat }}.js
          if-no-files-found: error

  publish:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci || npm install
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Merge prebuilds from all platforms
        run: |
          mkdir -p prebuilds lib/b64
          for d in art/prebuild-*; do
            cp -r "$d"/prebuilds/* prebuilds/
            cp -r "$d"/lib/b64/* lib/b64/
          done
          ls -R prebuilds lib/b64
      - name: Fill placeholders for any missing platform
        run: npm run gen-b64
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
